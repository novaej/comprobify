name: Terraform

# Applies infrastructure changes under terraform/ - never triggered by, and never
# triggers, deploy-staging.yml/deploy-production.yml (those only ship application code).
#
# One workflow, two job pairs (plan-staging/apply-staging, plan-production/apply-production)
# sharing the same trigger below - terraform plan/apply is idempotent, so an unrelated
# environment's pair just reports "no changes".
#
# DO_TOKEN/CLOUDFLARE_TOKEN live in each environment's own <env>-infra GitHub Environment,
# unprefixed. TERRAFORM_SPACES_* stay as repository secrets instead - staging and
# production share one state bucket, so there's only one correct value for either.
#
# plan-production/apply-production are deliberately never gated; plan-staging/apply-staging
# are, via STAGING_INFRA_ENABLED - see terraform-digitalocean-setup.md.
#
# `destroy` is manual-only, gated by the `action` workflow_dispatch input - a `push` event
# never has `github.event.inputs`, so `action` is only ever meaningfully set on a manual
# run, and destroy can never fire from a push no matter what the input default is. Default
# is `apply` so an unqualified `workflow_dispatch` (no -f action=..., or the UI's "Run
# workflow" button clicked without touching the dropdown) reproduces the exact plan+apply
# behavior this workflow always had, before `action` existed. Staging-only for now -
# terraform/environments/production has never been applied for real yet, so there's
# nothing there worth a destroy path until that changes.
#
# destroy reuses the SAME plan-staging/apply-staging jobs (branching their terraform
# command on `action`) rather than adding a third job, deliberately - apply-staging already
# declares `needs: plan-staging`, so with a required-reviewer rule on staging-infra this
# gives two separate approval gates for a destroy run: one before plan-staging starts
# (nothing to see yet), and a second one AFTER plan-staging's `-destroy` output is sitting
# in the logs for you to actually read, before apply-staging commits to the real
# `destroy -auto-approve`. A single combined job (an earlier version of this file had one)
# can only gate once, before either step - you'd approve blind and both the preview and the
# real destroy would run back-to-back with no chance to reconsider after seeing what's
# about to go. Two jobs, same names as every other run, is worth the extra indirection in
# the `run:` steps below for that alone.
#
# Before merging a change that first introduces the production-infra job pair: the
# `production-infra` GitHub Environment must already exist with real DO_TOKEN/
# CLOUDFLARE_TOKEN values (comprobify-terraform-production - see Prerequisites in
# terraform-digitalocean-setup.md), and the "Comprobify Production" DigitalOcean Project
# must already exist (main.tf's data "digitalocean_project" only looks it up by name, never
# creates it). Missing either one fails plan-production safely (bad/absent credentials, or a
# lookup that finds nothing) - it cannot touch real infra, since apply-production only runs
# if plan-production succeeds - but it's a red check either way, so set both up first.

on:
  push:
    branches: [main]
    paths: ['terraform/**']
  workflow_dispatch:
    inputs:
      action:
        description: 'plan (dry-run only), apply (default - plan then apply), or destroy'
        required: false
        default: apply
        type: choice
        options: [plan, apply, destroy]

jobs:
  plan-staging:
    if: vars.STAGING_INFRA_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging-infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5
      - run: terraform -chdir=terraform/environments/staging init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_SPACES_SECRET_ACCESS_KEY }}
      # Destroy's preview: `plan -destroy` instead of a plain `plan` when action=destroy.
      # A push event has no inputs.action, so it always takes the plain-plan branch.
      - run: |
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            terraform -chdir=terraform/environments/staging plan -destroy
          else
            terraform -chdir=terraform/environments/staging plan
          fi
        env:
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
          TF_VAR_cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_SPACES_SECRET_ACCESS_KEY }}

  apply-staging:
    needs: plan-staging
    # push never has inputs.action, so this stays true (unchanged behavior) for every
    # push-triggered run; a manual run skips this job only for a 'plan'-only dry run -
    # both the 'apply' default and 'destroy' proceed here, and which one actually happens
    # is decided inside the step below. ANDed with STAGING_INFRA_ENABLED so a manual
    # destroy/apply run still no-ops while staging's infra is disabled.
    if: (github.event_name == 'push' || github.event.inputs.action != 'plan') && vars.STAGING_INFRA_ENABLED == 'true'
    environment: staging-infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5
      - run: terraform -chdir=terraform/environments/staging init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_SPACES_SECRET_ACCESS_KEY }}
      # By the time this runs, plan's own log (this same run, job above) already shows
      # exactly what -destroy found - a required reviewer approving THIS job's gate has
      # had the chance to read it first.
      - run: |
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            terraform -chdir=terraform/environments/staging destroy -auto-approve
          else
            terraform -chdir=terraform/environments/staging apply -auto-approve
          fi
        env:
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
          TF_VAR_cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_SPACES_SECRET_ACCESS_KEY }}

  plan-production:
    runs-on: ubuntu-latest
    environment: production-infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5
      - run: terraform -chdir=terraform/environments/production init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_SPACES_SECRET_ACCESS_KEY }}
      - run: terraform -chdir=terraform/environments/production plan
        env:
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
          TF_VAR_cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_SPACES_SECRET_ACCESS_KEY }}

  apply-production:
    needs: plan-production
    environment: production-infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5
      - run: terraform -chdir=terraform/environments/production init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_SPACES_SECRET_ACCESS_KEY }}
      - run: terraform -chdir=terraform/environments/production apply -auto-approve
        env:
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
          TF_VAR_cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_SPACES_SECRET_ACCESS_KEY }}
