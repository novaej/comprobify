name: Deploy Staging

# DISABLED — staging's droplet is destroyed (STAGING_INFRA_ENABLED=false, see
# terraform.yml/terraform-digitalocean-setup.md's "Toggling staging infra on/off").
# release-staging.yml keeps fast-forwarding the `staging` branch on every tag push
# regardless - that's harmless, just git branch bookkeeping - but this workflow would
# SSH to a DROPLET_IP that no longer resolves to anything, failing every single run
# until the droplet exists again. Re-enable in the same cycle as flipping
# STAGING_INFRA_ENABLED back to true and re-provisioning: uncomment the `push` trigger
# below and remove the `if: false` guard on the `deploy` job.
on:
  # push:
  #   branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    if: false  # remove this line to re-enable
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      # Informational only for now (exit-code 0) — see deploy-production.yml's
      # matching step for why (docs/security-audit-2026-09-12.md #5).
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Push image
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

      # username here must match `deploy_username` in
      # terraform/environments/staging/terraform.tfvars - this is the unprivileged user
      # cloud-init creates on the droplet (docker group only, no sudo, no root login at
      # all). SSH itself is open to the internet (see main.tf's inbound_rule for port 22
      # and terraform-digitalocean-setup.md's "SSH access model" for why) - defense is
      # key-only auth + this privilege separation + fail2ban, not IP restriction.
      - name: Copy compose files to droplet
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: cpfydeploy9x
          key: ${{ secrets.INFRA_SSH_PRIVATE_KEY }}
          source: "deploy/docker-compose.yml,deploy/caddy/Caddyfile"
          target: /opt/comprobify
          strip_components: 1

      # API_BASE_URL (distinct from APP_BASE_URL, same value) is read only by
      # scripts/run-admin-job.js, which cron.d/comprobify-jobs on the droplet runs
      # inside this same api container to trigger the scheduled admin jobs - see
      # cloud-init.yaml.tftpl and terraform-digitalocean-setup.md's "Scheduled jobs"
      # section. Not used by the app itself.
      - name: Write env and restart containers
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: cpfydeploy9x
          key: ${{ secrets.INFRA_SSH_PRIVATE_KEY }}
          script: |
            cat > /opt/comprobify/.env <<'EOF'
            APP_ENV=${{ vars.APP_ENV }}
            APP_BASE_URL=${{ vars.APP_BASE_URL }}
            API_BASE_URL=${{ vars.APP_BASE_URL }}
            PUBLIC_DOMAIN=${{ vars.PUBLIC_DOMAIN }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_SSL=${{ vars.DB_SSL }}
            DB_SSL_CA=${{ secrets.DB_SSL_CA }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            ADMIN_SECRET=${{ secrets.ADMIN_SECRET }}
            INTERNAL_SERVICE_SECRET=${{ secrets.INTERNAL_SERVICE_SECRET }}
            EMAIL_FROM=${{ vars.EMAIL_FROM }}
            # Documented as staging/production Variables but previously never written
            # here, so a configured value was silently ignored. Both fall back with ||,
            # so an unset (empty) value keeps the existing behaviour.
            EMAIL_PROVIDER=${{ vars.EMAIL_PROVIDER }}
            EMAIL_FROM_DOCUMENTS=${{ vars.EMAIL_FROM_DOCUMENTS }}
            MAILGUN_API_KEY=${{ secrets.MAILGUN_API_KEY }}
            MAILGUN_DOMAIN=${{ vars.MAILGUN_DOMAIN }}
            MAILGUN_WEBHOOK_SIGNING_KEY=${{ secrets.MAILGUN_WEBHOOK_SIGNING_KEY }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_RELEASE=${{ github.sha }}
            BETTERSTACK_SOURCE_TOKEN=${{ secrets.BETTERSTACK_SOURCE_TOKEN }}
            BETTERSTACK_INGESTING_HOST=${{ vars.BETTERSTACK_INGESTING_HOST }}
            DOCS_BASE_URL=${{ vars.DOCS_BASE_URL }}
            BANK_TRANSFER_BANK_NAME=${{ vars.BANK_TRANSFER_BANK_NAME }}
            BANK_TRANSFER_ACCOUNT_TYPE=${{ vars.BANK_TRANSFER_ACCOUNT_TYPE }}
            BANK_TRANSFER_ACCOUNT_NUMBER=${{ vars.BANK_TRANSFER_ACCOUNT_NUMBER }}
            BANK_TRANSFER_ACCOUNT_HOLDER=${{ vars.BANK_TRANSFER_ACCOUNT_HOLDER }}
            BANK_TRANSFER_IDENTIFICATION=${{ vars.BANK_TRANSFER_IDENTIFICATION }}
            ADMIN_NOTIFICATION_EMAIL=${{ vars.ADMIN_NOTIFICATION_EMAIL }}
            OPERATOR_NAME=${{ vars.OPERATOR_NAME }}
            OPERATOR_RUC=${{ vars.OPERATOR_RUC }}
            OPERATOR_EMAIL=${{ vars.OPERATOR_EMAIL }}
            OPERATOR_ADDRESS=${{ vars.OPERATOR_ADDRESS }}
            RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}
            # Card payments. Both unset => the card endpoints return 503 and SPI is
            # unaffected, so an absent secret degrades instead of breaking billing.
            PAYPHONE_TOKEN=${{ secrets.PAYPHONE_TOKEN }}
            PAYPHONE_STORE_ID=${{ secrets.PAYPHONE_STORE_ID }}
            # Unset renders empty, and '' !== 'false', so the acceptance gate stays ON
            # by default. Set the variable to exactly "false" to launch without them.
            AGREEMENTS_ENABLED=${{ vars.AGREEMENTS_ENABLED }}
            REDIS_URL=redis://redis:6379
            EOF
            chmod 600 /opt/comprobify/.env
            cd /opt/comprobify
            export IMAGE_TAG=${{ github.sha }}
            # The docker/login-action step earlier only authenticates the GitHub Actions
            # runner's own Docker daemon (so it can push) - the droplet's daemon, pulling
            # over this SSH session, has never logged into GHCR and needs its own login.
            # Reuses this job's own GITHUB_TOKEN (already scoped packages: write, which
            # covers pulling too) rather than a separate long-lived PAT - it's re-issued
            # fresh every run anyway, so there's nothing to rotate later.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            # docker compose up -d only recreates a container when the service
            # definition itself changes (image tag, env, volumes list) - Caddyfile
            # is bind-mounted, so a content-only change on disk is invisible to
            # Compose and the running caddy container keeps serving whatever
            # config it loaded at startup. Reload explicitly so a Caddyfile-only
            # change (e.g. trusted proxy headers) actually takes effect.
            #
            # Retried: on a freshly (re)created caddy container - e.g. right after a
            # droplet replacement, as with the SSH key rotation flow in
            # terraform-digitalocean-setup.md - the admin API (:2019) can still be
            # binding a moment after Compose reports the container "Started", racing
            # this reload into a false "connection refused" failure even though caddy
            # already loaded the Caddyfile fine via its own normal startup. A real,
            # ongoing failure still fails the step - it just survives that one race.
            for i in 1 2 3 4 5; do
              docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile && exit 0
              echo "caddy reload attempt $i/5 failed, retrying in 2s..."
              sleep 2
            done
            exit 1
