name: CI

# Runs the unit test suite and an npm audit against production dependencies
# on every PR and push to main. Required as a status check on the main
# branch ruleset, so a PR can't merge with a failing test or a newly
# introduced vulnerable production dependency.
#
# Unit and integration tests run as separate steps: test:unit needs no
# database, test:integration runs against the throwaway Postgres service
# below (never a real database - the tests create and delete fixture rows).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test and audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # xml-validator.service.js shells out to the real xmllint CLI (see
      # CLAUDE.md's XSD validation entry) - the Dockerfile installs this via
      # apt-get for the deployed image, but a bare ubuntu-latest runner
      # doesn't have it, so tests exercising real XSD validation fail with no
      # useful error otherwise. Same package the Dockerfile installs.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      - run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      # The app role must be a plain, non-superuser role that owns its own
      # tables - superusers bypass RLS, which would make the RLS tests pass
      # for the wrong reason. Mirrors GETTING_STARTED.md's local setup.
      - name: Create integration test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE comprobify_app LOGIN PASSWORD 'ci_password'" \
            -c "CREATE DATABASE comprobify_test OWNER comprobify_app"

      - name: Run integration tests
        env:
          APP_ENV: staging
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: comprobify_test
          DB_USER: comprobify_app
          DB_PASSWORD: ci_password
          DB_SSL: 'false'
        run: |
          npm run migrate
          npm run test:integration

      # Production dependencies only - dev-only tooling (currently
      # vitepress's own vite/esbuild pin, see docs/security-audit-2026-09-12.md
      # #6) can carry findings with no fix available yet upstream, which
      # would make this gate permanently red for something nobody can act on.
      #
      # scripts/check-audit.js wraps the raw `npm audit` with a small,
      # documented allowlist for the same reason, scoped to individual
      # production advisories that have no patched version upstream (see #6)
      # rather than excluding a whole dependency tree - everything else still
      # fails the build.
      - name: Audit production dependencies
        run: node scripts/check-audit.js
