name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - '.cloudflare/pages.toml'
      - '.github/workflows/docs.yml'
      # The footer displays the API version read live from package.json at
      # build time (see .vitepress/config.mjs) - without this, a version-bump
      # release PR (which never touches docs/site/**) would leave the
      # deployed docs site showing a stale version indefinitely.
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run docs:build

      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.DOCS_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.DOCS_CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/site/.vitepress/dist --project-name=comprobify-docs --branch=main
