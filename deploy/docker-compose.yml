services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: ghcr.io/novaej/comprobify:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # Staging's cluster also hosts comprobify-web's database (see
      # docs/deployment.md) — this value leaves headroom for that consumer
      # too, not just this process. Re-check against the real cluster's
      # connection ceiling once provisioned.
      - DB_POOL_MAX=6
    command: node app.js
    expose:
      - "8080"
    mem_limit: 300m

  worker:
    image: ghcr.io/novaej/comprobify:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_POOL_MAX=3
    command: node workers/worker.js
    mem_limit: 150m

volumes:
  caddy_data:
  caddy_config:
