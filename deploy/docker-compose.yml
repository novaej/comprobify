services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Directory mount, not a single-file mount: a single-file bind mount pins to
    # that file's inode at container-start time, so a deploy that replaces the
    # host file via unlink+recreate (not truncate-in-place) leaves the running
    # container reading the old, now-unlinked inode forever - invisible to
    # `caddy reload`, fixable only by recreating the container. A directory mount
    # reflects the current file on every read.
    volumes:
      - ./caddy:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: ghcr.io/novaej/comprobify:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    # Read by src/services/logger.service.js's os.hostname() call — every log
    # line carries this so staging/production/local are distinguishable when
    # they all ship to the same Betterstack source. ${APP_ENV} is read from
    # the same .env this file's env_file already loads (Compose auto-loads a
    # .env in its own directory for ${...} interpolation), so this resolves
    # to comprobify-api-staging today, comprobify-api-production once that
    # droplet exists — no value to keep in sync by hand.
    hostname: comprobify-api-${APP_ENV:-local}
    environment:
      # Staging's cluster also hosts comprobify-web's database (see
      # docs/deployment.md) — this value leaves headroom for that consumer
      # too, not just this process. Re-check against the real cluster's
      # connection ceiling once provisioned.
      - DB_POOL_MAX=6
    command: node app.js
    expose:
      - "8080"
    mem_limit: 300m
    depends_on:
      - redis

  worker:
    image: ghcr.io/novaej/comprobify:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    hostname: comprobify-worker-${APP_ENV:-local}
    environment:
      - DB_POOL_MAX=3
    command: node workers/worker.js
    mem_limit: 150m

  # Backs the rate limiters' shared store (src/services/redis.service.js,
  # src/middleware/rate-limit.js) — required for every `api` instance to
  # enforce one shared counter per key once there's more than one. No
  # persistence (--save "") and a hard memory cap: rate-limit counters are
  # disposable short-window state, not data worth surviving a restart, and
  # this is a 1GB droplet already budgeted for api+worker.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru --save ""
    expose:
      - "6379"
    mem_limit: 48m

volumes:
  caddy_data:
  caddy_config:
